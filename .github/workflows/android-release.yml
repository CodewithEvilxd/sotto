name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun ci

      - name: Validate app
        run: |
          bun run typecheck
          bun run lint
          bun test
          bun run format:check
          bun run docs:audit

      - name: Generate Android project
        run: bunx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK with tag
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/sotto-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sotto ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Sotto ${{ github.ref_name }} — Voice-First Idea Capture 🎙️

            Local-first, voice-first intelligence engine for capturing ideas before they disappear.

            ### ✨ Highlights:
            - **🎙️ Hero Voice Recorder**: Instant low-friction recording directly on the home screen with real-time live transcription.
            - **🏛️ Searchable Vault**: Local SQLite archive with full-text search across all captures and reports.
            - **📊 Structured Dossiers**: Automated breakdown into Gist, Evidence, Risk Check, and Next Steps with PDF export.
            - **💬 AI Discussion**: Interrogate and evolve ideas with your configured AI model.
            - **🔒 100% Local-First & Private**: Zero server accounts, on-device SQLite, and hardware keystore encryption.

            ### 📱 Download & Install:
            Download the attached `sotto-${{ github.ref_name }}.apk` asset below to install directly on your Android device.
          files: android/app/build/outputs/apk/release/sotto-${{ github.ref_name }}.apk
